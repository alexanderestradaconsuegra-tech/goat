server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://gsvnshhisqsjyhugmldp.supabase.co; img-src 'self' data: blob: https://gsvnshhisqsjyhugmldp.supabase.co; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  location ~* \.(woff2|png|jpg|webp|svg)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    # add_header en location anula los del server: repetir los de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }
  location ~* \.(js|css)$ {
    expires 5m;
    add_header Cache-Control "public, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
  }
  location / { try_files $uri $uri/ /index.html; }
}
